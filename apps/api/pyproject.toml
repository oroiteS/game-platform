[project]
name = "game-platform-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "flask-sock>=0.7.0",
  "game-platform-games",
]

[tool.uv.sources]
game-platform-games = { path = "../..", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
